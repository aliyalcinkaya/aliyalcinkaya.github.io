<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="icon" href="data:,">
  <title>Ali Yalcin Kaya</title>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <main aria-label="Visuals">
    <div id="stage"></div>
  </main>

  <header class="site-header">
    <h1 class="site-name">Ali Yalcin Kaya</h1>
    <a class="header-link" href="about.html">About</a>
  </header>

  <footer class="player" aria-label="Media player">
    <div class="track">
      <img src="assets/spore/8/poster.jpg" width="56" height="56" alt="">
      <div>
        <p id="title" aria-live="polite">Maze - Vocoder Vocals</p>
      </div>
    </div>

    <section class="transport" aria-label="Playback">
      <audio preload="metadata"></audio>
      <div class="playback-buttons">
        <button class="icon-button" id="prev" aria-label="Previous track"><span class="skip-icon back"></span></button>
        <button class="icon-button" id="play" aria-label="Play"><span class="play-icon"></span></button>
        <button class="icon-button" id="next" aria-label="Next track"><span class="skip-icon"></span></button>
      </div>
      <div class="timeline">
        <span id="elapsed">0:00</span>
        <input id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Seek" disabled>
        <span id="duration">0:00</span>
      </div>
    </section>

    <div class="player-actions">
      <details class="playlist">
        <summary>Playlist</summary>
        <section class="playlist-panel" aria-labelledby="playlist-title">
          <header class="playlist-header">
            <h2 id="playlist-title">Playlist</h2>
            <button id="close-playlist" class="icon-button" aria-label="Close playlist">×</button>
          </header>
          <ul id="queue" class="song-list" aria-label="Songs"></ul>
          <label class="pick">Add songs<input type="file" id="file" accept="audio/*" multiple></label>
        </section>
      </details>
      <button id="like" class="icon-button like-button" aria-label="Like track" aria-pressed="false" title="Like track" hidden>
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20.8 4.6a5.3 5.3 0 0 0-7.5 0L12 5.9l-1.3-1.3a5.3 5.3 0 1 0-7.5 7.5L12 21l8.8-8.9a5.3 5.3 0 0 0 0-7.5Z"/>
        </svg>
      </button>
      <button class="icon-button fullscreen-button" id="expand" aria-label="Fullscreen" aria-pressed="false" title="Fullscreen" hidden>
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path class="expand-icon" d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/>
          <path class="shrink-icon" d="M4 9h5V4m11 5h-5V4M9 20v-5H4m11 5v-5h5"/>
        </svg>
      </button>
    </div>
    <p id="playback-status" role="status"></p>
    <small class="site-credit">© 2026 Ali Yalcin Kaya · Animations by <a href="https://spite.github.io/codevember-2026/">Jaume Sanchez Elias</a></small>
  </footer>

  <script type="module" src="player.js"></script>
  <script type="module" src="visual-stage.js"></script>
</body>
</html>
